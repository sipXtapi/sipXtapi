name: SipX MSVS Windows build
on:
  push:
    #branches: [ $default-branch ]
  pull_request:
    # all PRs for now
    #branches: [ $default-branch ]

jobs:
  # Label of the runner job
  sipx-build:

    strategy:
      fail-fast: false
      matrix:
        include:
          - msvs_year: 2019
            solution_file: sipX-msvc16.sln
            # VS 2019 is no longer available on any GitHub-hosted runner image.
            # We install Build Tools via chocolatey onto windows-2022 below.
            vs_devcmd_path: 'C:\Program Files (x86)\Microsoft Visual Studio\2019\BuildTools\Common7\Tools\VsMSBuildCmd.bat'
            install_vs2019: true
          - msvs_year: 2022
            solution_file: sipX-msvc17.sln
            # VS 2022 Enterprise is pre-installed on windows-2022.
            vs_devcmd_path: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsMSBuildCmd.bat'
            install_vs2019: false

    # windows-2019 was retired by GitHub on 2025-06-30. Both matrix rows now
    # run on windows-2022; the VS 2019 row installs Build Tools at runtime.
    runs-on: windows-2022

    steps:

      - name: system info
        run: |
          systeminfo | findstr /B /C:"OS Name" /B /C:"OS Version"
          python3 --version
        shell: cmd

      - name: install Visual Studio 2019 Build Tools
        if: matrix.install_vs2019
        run: |
          # Install the VS 2019 Build Tools shell, then the C++ workload.
          # The workload package is what actually pulls in cl.exe / MSBuild
          # for v142; without it you get an empty shell.
          choco install -y visualstudio2019buildtools
          choco install -y visualstudio2019-workload-vctools
        shell: cmd

      - name: print installed VS 2019 chocolatey versions
        if: matrix.install_vs2019
        # Print the chocolatey package versions actually installed so that
        # if a future chocolatey update breaks the build we can identify the
        # last good versions from a passing CI run and pin to them.
        run: |
          echo === chocolatey package versions ===
          choco list visualstudio2019buildtools
          choco list visualstudio2019-workload-vctools
        shell: cmd

      - name: verify build environment
        # Runs for both matrix rows. Confirms VsMSBuildCmd.bat exists at the
        # expected path and prints MSBuild / cl.exe versions for diagnostics.
        # If a future update breaks the build, the last passing CI run shows
        # the exact toolchain versions to compare against.
        run: |
          echo === VsMSBuildCmd.bat path check ===
          if exist "${{ matrix.vs_devcmd_path }}" (
            echo Found: ${{ matrix.vs_devcmd_path }}
          ) else (
            echo MISSING: ${{ matrix.vs_devcmd_path }}
            exit /b 1
          )
          echo.
          echo === MSBuild and cl.exe versions ===
          call "${{ matrix.vs_devcmd_path }}" -arch=x64
          msbuild.exe -version
          cl.exe 2>&1 | findstr /C:"Version"
        shell: cmd

      - name: checkout ${{ github.ref }}
        # Downloads a copy of the code in your repository before running CI tests
        uses: actions/checkout@v4
        with:
          repository: sipXtapi/sipXtapi

      - name: MSVS ${{ matrix.msvs_year }} build
        run: |
          call "${{ matrix.vs_devcmd_path }}" -arch=x64
          echo %PATH%
          dir
          msbuild.exe ${{ matrix.solution_file }} /t:Clean,Build /p:Configuration=Release /p:Platform=x64
        shell: cmd

