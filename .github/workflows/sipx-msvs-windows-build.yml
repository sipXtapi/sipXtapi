name: SipX MSVS Windows build
on:
  push:
    #branches: [ $default-branch ]
  pull_request:
    # all PRs for now
    #branches: [ $default-branch ]

jobs:
  # Label of the runner job
  sipx-build:

    strategy:
      fail-fast: false
      matrix:
        include:
          - msvs_year: 2019
            solution_file: sipX-msvc16.sln
            # VS 2019 is no longer available on any GitHub-hosted runner image.
            # We install Build Tools via chocolatey onto windows-2022 below.
            vs_devcmd_path: 'C:\Program Files (x86)\Microsoft Visual Studio\2019\BuildTools\Common7\Tools\VsMSBuildCmd.bat'
            install_vs2019: true
          - msvs_year: 2022
            solution_file: sipX-msvc17.sln
            # VS 2022 Enterprise is pre-installed on windows-2022.
            vs_devcmd_path: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsMSBuildCmd.bat'
            install_vs2019: false

    # windows-2019 was retired by GitHub on 2025-06-30. Both matrix rows now
    # run on windows-2022; the VS 2019 row installs Build Tools at runtime.
    runs-on: windows-2022
    env:
      PLATFORM_LABEL: windows-vs${{ matrix.msvs_year }}

    steps:

      - name: system info
        run: |
          systeminfo | findstr /B /C:"OS Name" /B /C:"OS Version"
          python3 --version
        shell: cmd

      - name: install Visual Studio 2019 Build Tools
        if: matrix.install_vs2019
        run: |
          # Install the VS 2019 Build Tools shell, then the C++ workload.
          # The workload package is what actually pulls in cl.exe / MSBuild
          # for v142; without it you get an empty shell.
          choco install -y visualstudio2019buildtools
          choco install -y visualstudio2019-workload-vctools
        shell: cmd

      - name: print installed VS 2019 chocolatey versions
        if: matrix.install_vs2019
        # Print the chocolatey package versions actually installed so that
        # if a future chocolatey update breaks the build we can identify the
        # last good versions from a passing CI run and pin to them.
        run: |
          echo === chocolatey package versions ===
          choco list visualstudio2019buildtools
          choco list visualstudio2019-workload-vctools
        shell: cmd

      - name: verify build environment
        # Runs for both matrix rows. Confirms VsMSBuildCmd.bat exists at the
        # expected path and prints MSBuild / cl.exe versions for diagnostics.
        # If a future update breaks the build, the last passing CI run shows
        # the exact toolchain versions to compare against.
        #
        # Notes:
        # - We avoid `if exist (...) else (...)` because the VS 2019 path
        #   contains "Program Files (x86)" and cmd.exe parses the `)` of
        #   `(x86)` as the close of the `if` block. Use goto labels instead.
        # - `cl.exe` with no args prints its banner and exits non-zero on
        #   some versions; we run it last and don't fail the step on its
        #   exit code.
        run: |
          echo === VsMSBuildCmd.bat path check ===
          if not exist "${{ matrix.vs_devcmd_path }}" goto :missing
          echo Found: ${{ matrix.vs_devcmd_path }}
          goto :found
          :missing
          echo MISSING: ${{ matrix.vs_devcmd_path }}
          exit /b 1
          :found
          echo.
          echo === MSBuild and cl.exe versions ===
          call "${{ matrix.vs_devcmd_path }}" -arch=x64
          msbuild.exe -version
          echo.
          cl.exe
          exit /b 0
        shell: cmd

      - name: checkout ${{ github.ref }}
        # Downloads a copy of the code in your repository before running CI tests
        uses: actions/checkout@v5
        with:
          repository: sipXtapi/sipXtapi

      - name: MSVS ${{ matrix.msvs_year }} build
        run: |
          call "${{ matrix.vs_devcmd_path }}" -arch=x64
          echo %PATH%
          dir
          msbuild.exe ${{ matrix.solution_file }} /t:Clean,Build /p:Configuration=Release /p:Platform=x64
        shell: cmd

      - name: copy codec DLLs for test runner
        run: |
          if not exist x64\bin mkdir x64\bin
          xcopy x64\Release\codec_*.dll x64\bin\ /Y
        shell: cmd

      - name: install virtual audio driver
        shell: powershell
        run: |
          Set-Service -Name audiosrv -StartupType Automatic
          Start-Service -Name audiosrv

          # Pin to the specific release tag so we get reproducible behavior.
          # Bump the tag deliberately when the project ships a new release.
          $tag = "25.7.14"
          $apiUrl = "https://api.github.com/repos/VirtualDrivers/Virtual-Audio-Driver/releases/tags/$tag"

          Write-Host "Fetching release metadata from $apiUrl"
          $headers = @{ "User-Agent" = "sipxtapi-ci" }
          if ($env:GITHUB_TOKEN) {
            # Authenticated requests get a 5000/hr rate limit instead of 60/hr.
            # GITHUB_TOKEN is provided automatically by Actions.
            $headers["Authorization"] = "Bearer $env:GITHUB_TOKEN"
          }
          $release = Invoke-RestMethod -Uri $apiUrl -Headers $headers
          Write-Host "Release '$($release.name)' has $($release.assets.Count) asset(s):"
          $release.assets | ForEach-Object { Write-Host "  - $($_.name)  ($([math]::Round($_.size/1MB,2)) MB)" }

          # Pick the asset that looks like a signed x64 zip.
          # The release page calls it "Signed" - prefer that, fall back to any zip.
          $asset = $release.assets |
            Where-Object { $_.name -match '\.zip$' -and $_.name -match '(signed|x64)' } |
            Select-Object -First 1
          if (-not $asset) {
            $asset = $release.assets | Where-Object { $_.name -match '\.zip$' } | Select-Object -First 1
          }
          if (-not $asset) {
            Write-Error "No .zip asset found in release $tag"
            exit 1
          }
          Write-Host "Selected asset: $($asset.name)"
          Write-Host "Download URL: $($asset.browser_download_url)"

          $zipPath = "$env:TEMP\VAD.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath -Headers @{ "User-Agent" = "sipxtapi-ci" }
          Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP\VAD" -Force

          Write-Host "Extracted contents:"
          Get-ChildItem -Path "$env:TEMP\VAD" -Recurse | Select-Object FullName | Format-Table -AutoSize

          $inf = Get-ChildItem -Path "$env:TEMP\VAD" -Filter "*.inf" -Recurse |
                 Where-Object { $_.Name -match 'VirtualAudioDriver' } |
                 Select-Object -First 1
          if (-not $inf) {
            Write-Error "VirtualAudioDriver.inf not found in extracted zip"
            exit 1
          }
          Write-Host "Found INF at: $($inf.FullName)"

          $sys = Get-ChildItem -Path "$env:TEMP\VAD" -Filter "VirtualAudioDriver.sys" -Recurse | Select-Object -First 1
          if ($sys) {
            $sig = Get-AuthenticodeSignature $sys.FullName
            Write-Host "Driver signature status: $($sig.Status)"
            Write-Host "Signer: $($sig.SignerCertificate.Subject)"
            Write-Host "Cert valid until: $($sig.SignerCertificate.NotAfter)"
            if ($sig.SignerCertificate) {
              $store = [System.Security.Cryptography.X509Certificates.X509Store]::new("TrustedPublisher","LocalMachine")
              $store.Open("ReadWrite"); $store.Add($sig.SignerCertificate); $store.Close()
              Write-Host "Added signer to TrustedPublisher store"
            }
          }

          Write-Host "Running pnputil /add-driver $($inf.FullName) /install"
          $pnpOutput = & pnputil /add-driver $inf.FullName /install 2>&1
          $rc = $LASTEXITCODE
          $pnpOutput | ForEach-Object { Write-Host "  $_" }
          Write-Host "pnputil exit code: $rc"

          Write-Host "Running pnputil /scan-devices to enumerate without reboot"
          pnputil /scan-devices

          Start-Sleep -Seconds 3

          Write-Host "Win32_SoundDevice query:"
          Get-CimInstance Win32_SoundDevice | Format-Table Name, Status, Manufacturer -AutoSize

          Write-Host "PnP MEDIA-class devices:"
          Get-PnpDevice -Class MEDIA -ErrorAction SilentlyContinue | Format-Table FriendlyName, Status, Class -AutoSize

      - name: verify audio endpoint usable
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Speech
          $synth = [System.Speech.Synthesis.SpeechSynthesizer]::new()
          # If this throws, there is no usable output endpoint.
          $synth.SetOutputToDefaultAudioDevice()
          Write-Host "default audio device usable"

      - name: run unit tests
        run: python scripts/sipx_test_runner.py
        shell: cmd
        continue-on-error: true

      - name: push test results
        if: github.event_name == 'push'
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.RESULTS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"

          BRANCH="${GITHUB_REF_NAME}"
          git clone git@github.com:sipXtapi/sipXtapi-test-results.git results-repo
          mkdir -p "results-repo/summaries/${BRANCH}/${PLATFORM_LABEL}"
          cp test_summary_*.json "results-repo/summaries/${BRANCH}/${PLATFORM_LABEL}/"

          cd results-repo
          git config user.name "sipXtapi CI"
          git config user.email "ci@sipxtapi.org"
          git add .
          git commit -m "${PLATFORM_LABEL} ${BRANCH} $(date +%Y%m%d_%H%M)"
          for attempt in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done

      - name: upload test summary artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-summary-vs${{ matrix.msvs_year }}
          path: test_summary_*.json
          retention-days: 90
          if-no-files-found: ignore

