name: SipX autotools Linux build
on:
  push:
    #branches: [ $default-branch ]
  pull_request:
    # all PRs for now
    #branches: [ $default-branch ]

env:
  CFLAGS: "-O0 -g -fPIC -fpermissive"
  MAKE_USE_CPUS: " -j 1 "

jobs:
  # Label of the runner job
  sipx-autotools-linux-build:

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            toolchain: gcc-11
          - os: ubuntu-24.04
            toolchain: gcc-13

    runs-on: ${{ matrix.os }}
    env:
      PLATFORM_LABEL: linux-${{ matrix.os }}-${{ matrix.toolchain }}

    steps:

      - name: install dev and runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git g++ subversion gdb make libpcre3-dev autoconf automake libtool pkg-config valgrind libasound2-dev alsa-utils libssl-dev patch libspeex-dev libspandsp-dev bc unrar unzip
          find / -name 'librt-*.so' -ls 2> /dev/null || true

      - name: checkout ${{ github.ref }}
      # Downloads a copy of the code in your repository before running CI tests
        uses: actions/checkout@v4
        #with:
        #  repository: sipXtapi/sipXtapi

      - name: view checkout results
        run: |
          ls -l

      - name: probe 3gpp download reachability
        continue-on-error: true
        run: |
          URL=https://www.3gpp.org/ftp/Specs/archive/26_series/26.104/26104-700.zip
          REF=https://www.3gpp.org/ftp/Specs/archive/26_series/26.104/
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'

          echo "=== 1. curl, default UA ==="
          curl -sS -L --max-time 60 -o /tmp/p1.bin -D /tmp/h1.txt \
               -w 'http_code=%{http_code} size=%{size_download}\n' "$URL" || true
          sed -n '1,40p' /tmp/h1.txt || true
          file /tmp/p1.bin || true

          echo "=== 2. curl, browser UA + referer ==="
          curl -sS -L --max-time 60 -A "$UA" -e "$REF" \
               -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
               -H 'Accept-Language: en-US,en;q=0.9' \
               -o /tmp/p2.bin -D /tmp/h2.txt \
               -w 'http_code=%{http_code} size=%{size_download}\n' "$URL" || true
          sed -n '1,40p' /tmp/h2.txt || true
          file /tmp/p2.bin || true
          head -c 4 /tmp/p2.bin | od -c | head -2 || true

          echo "=== 3. wget, default UA ==="
          wget --server-response --tries=1 --timeout=30 -O /tmp/p3.bin "$URL" 2>&1 | head -40 || true
          file /tmp/p3.bin || true

          echo "=== 4. wget, browser UA + referer ==="
          wget --server-response --tries=1 --timeout=30 \
               --user-agent="$UA" --referer="$REF" \
               --header='Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
               --header='Accept-Language: en-US,en;q=0.9' \
               -O /tmp/p4.bin "$URL" 2>&1 | head -40 || true
          file /tmp/p4.bin || true
          unzip -t /tmp/p4.bin > /dev/null 2>&1 && echo "p4 IS a valid zip" || echo "p4 is NOT a valid zip"

          echo "=== runner egress IP ==="
          curl -sS --max-time 20 https://api.ipify.org || true
          echo

      - name: detect autoconf version and select patch
        id: patch
        run: |
          autoconf_version=$(autoconf --version | head -1 | grep -oP '\d+\.\d+')
          echo "using autoconf version: $autoconf_version"
          major=$(echo "$autoconf_version" | cut -d. -f1)
          minor=$(echo "$autoconf_version" | cut -d. -f2)
          if [ "$major" -eq 2 ] && [ "$minor" -ge 70 ]; then
            PATCH_FILE="../configure-2.70+.patch"
          else
            PATCH_FILE="../configure.patch"
          fi
          echo "Using patch file: $PATCH_FILE"
          echo "PATCH_FILE=$PATCH_FILE" >> "$GITHUB_ENV"

      - name: build sipXportLib
        run: |
          echo CFLAGS: $CFLAGS
          echo PATCH_FILE: $PATCH_FILE
          cd sipXportLib
          if [ ! -f configure ] ; then autoreconf -if ; fi
          patch configure < ${PATCH_FILE}
          if [ ! -f Makefile ] ; then ./configure --without-sipxopenssl --without-cppunit; fi
          make $MAKE_USE_CPUS
          make tests

      - name: build sipXsdpLib
        run: |
          echo PWD: `pwd`
          echo CFLAGS: $CFLAGS
          echo PATCH_FILE: $PATCH_FILE
          cd sipXsdpLib
          if [ ! -f configure ] ; then autoreconf -if ; fi
          patch configure < ${PATCH_FILE}
          if [ ! -f Makefile ] ; then ./configure --without-sipxopenssl ; fi
          make $MAKE_USE_CPUS
          make tests

      - name: build sipXtackLib
        run: |
          echo PWD: `pwd`
          echo CFLAGS: $CFLAGS
          echo PATCH_FILE: $PATCH_FILE
          cd sipXtackLib
          if [ ! -f configure ] ; then autoreconf -if ; fi
          patch configure < ${PATCH_FILE}
          if [ ! -f Makefile ] ; then ./configure --without-sipxopenssl --disable-sipviewer; fi
          make $MAKE_USE_CPUS
          make tests

      - name: build sipXmediaLib
        run: |
          echo PWD: `pwd`
          echo CFLAGS: $CFLAGS
          echo PATCH_FILE: $PATCH_FILE
          cd sipXmediaLib
          if [ ! -f configure ] ; then autoreconf -if ; fi
          patch configure < ${PATCH_FILE}
          if [ ! -f Makefile ] ; then ./configure --without-sipxopenssl --disable-stream-player --enable-contrib-speex --enable-speex-dsp --enable-codec-speex --enable-codec-amr --enable-codec-amrwb --enable-codec-g726 --enable-codec-g722 --enable-codec-g7221 --enable-codec-g729 --enable-codec-ilbc --enable-codec-gsm --enable-codec-opus --enable-local-audio --with-downloader="wget --user-agent=Mozilla/5.0 --tries=3 --timeout=30" ; fi
          make $MAKE_USE_CPUS
          make tests

      - name: build sipXmediaAdapterLib
        run: |
          echo PWD: `pwd`
          echo CFLAGS: $CFLAGS
          echo PATCH_FILE: $PATCH_FILE
          cd sipXmediaAdapterLib
          if [ ! -f configure ] ; then autoreconf -if ; fi
          patch configure < ${PATCH_FILE}
          if [ ! -f Makefile ] ; then ./configure --enable-topology-graph --without-sipxopenssl --enable-contrib-speex --enable-speex-dsp --disable-stream-player --enable-alsa-audio --enable-codec-gsm; fi
          make $MAKE_USE_CPUS
          make tests

      - name: build sipXcallLib
        run: |
          echo PWD: `pwd`
          echo CFLAGS: $CFLAGS
          echo PATCH_FILE: $PATCH_FILE
          cd sipXcallLib
          if [ ! -f configure ] ; then autoreconf -if ; fi
          patch configure < ${PATCH_FILE}
          if [ ! -f Makefile ] ; then ./configure --without-sipxopenssl --enable-receivecall --enable-placecall; fi
          make $MAKE_USE_CPUS
          make tests

      - name: provide a virtual audio device
        run: |
          if sudo modprobe snd-aloop 2>/dev/null; then
            echo "Using snd-aloop loopback device"
            cat > ~/.asoundrc <<'EOF'
          pcm.!default {
            type plug
            slave.pcm "hw:Loopback,0,0"
          }
          ctl.!default {
            type hw
            card Loopback
          }
          EOF
            aplay -l
            arecord -l
          else
            echo "snd-aloop unavailable; falling back to PulseAudio null sink"
            sudo apt-get install -y pulseaudio pulseaudio-utils libasound2-plugins
            pulseaudio --start --exit-idle-time=-1 \
              --load="module-null-sink sink_name=DummyOutput" \
              --load="module-null-source source_name=DummySource"
            cat > ~/.asoundrc <<'EOF'
          pcm.!default { type pulse }
          ctl.!default { type pulse }
          EOF
            pactl info
            pactl list short sinks
          fi

      - name: verify audio endpoint usable
        run: |
          # Use 50ms of zeros at the rates the tests actually use.
          # 48000 Hz / 16 kHz are both rates the sipX tests open with.
          timeout 5 aplay -D default -q -d 1 -t raw -f S16_LE -r 48000 -c 2 /dev/zero
          echo "audio endpoint OK at 48000 Hz"
          timeout 5 aplay -D default -q -d 1 -t raw -f S16_LE -r 16000 -c 1 /dev/zero
          echo "audio endpoint OK at 16000 Hz"

      - name: run unit tests
        env:
          SIPX_ALSA_DEVICE_NAME: default
        run: |
          ulimit -a
          stdbuf -oL bash -c 'while true; do echo "=== RESOURCES $(date -u +%H:%M:%S) ==="; free -m; ps -e | wc -l; sleep 30; done' &
          MONITOR_PID=$!
          echo "=== START: $(date -u +%Y-%m-%dT%H:%M:%S) ==="
          python3 scripts/sipx_test_runner.py --timeout 30 2>&1 | tee test_runner_output.txt || true
          echo "=== END: $(date -u +%Y-%m-%dT%H:%M:%S) ==="
          kill $MONITOR_PID 2>/dev/null || true

      - name: upload test runner log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-runner-log-${{ matrix.os }}
          path: test_runner_output.txt
          retention-days: 90
          if-no-files-found: ignore

      - name: push test results
        if: github.event_name == 'push'
        env:
          DEPLOY_KEY: ${{ secrets.RESULTS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"

          BRANCH="${GITHUB_REF_NAME}"
          git clone git@github.com:sipXtapi/sipXtapi-test-results.git results-repo
          mkdir -p "results-repo/summaries/${BRANCH}/${PLATFORM_LABEL}"
          cp test_summary_*.json "results-repo/summaries/${BRANCH}/${PLATFORM_LABEL}/"

          cd results-repo
          git config user.name "sipXtapi CI"
          git config user.email "ci@sipxtapi.org"
          git add .
          git commit -m "${PLATFORM_LABEL} ${BRANCH} $(date +%Y%m%d_%H%M)"
          for attempt in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done

      - name: upload test summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary-${{ matrix.os }}
          path: test_summary_*.json
          retention-days: 90
          if-no-files-found: ignore

